services:
  imagine-publisher:
    build: .
    container_name: imagine-publisher
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      - PORT=3005
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    expose:
      - "3005"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - n8n_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.imagine-publisher.rule=Host(`publisher.imaginegroup.com.br`)"
      - "traefik.http.routers.imagine-publisher.entrypoints=web,websecure"
      - "traefik.http.routers.imagine-publisher.tls=true"
      - "traefik.http.routers.imagine-publisher.tls.certresolver=mytlschallenge"
      - "traefik.http.services.imagine-publisher.loadbalancer.server.port=3005"

networks:
  n8n_default:
    external: true
